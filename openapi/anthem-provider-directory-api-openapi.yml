openapi: 3.1.0
info:
  title: Anthem Provider Directory FHIR API
  version: 1.0.0
  description: 'Anthem''s CMS-mandated Provider Directory API, delivered as HL7 FHIR R4 (4.0.1) and conforming to
    the Da Vinci PDEX Plan Net 1.1.0 and HL7 FHIR US Core STU 3.1.1 implementation guides. Exposes network practitioners,
    practitioner roles, organizations, organization affiliations, locations, healthcare services and insurance plans
    for Anthem and affiliated Elevance Health brands.


    DERIVED, operation by operation, from the live CapabilityStatement the server itself publishes at https://totalview.healthos.elevancehealth.com/resources/unregistered/api/v1/fhir/cms_mandate/mcd/metadata
    (fetched 2026-09-02, HTTP 200, publisher ''Elevance Health, Inc'') and from the search-parameter tables in Anthem''s
    own Interoperability API Endpoint Support Document (IO105 v15.0, effective 2025-11-18). Every path, interaction
    and search parameter below is declared by Anthem; the OpenAPI structure and the operationIds are the API Evangelist
    pipeline''s.'
  contact:
    name: Anthem Interoperability Workgroup
    email: interoperabilityworkgroup@anthem.com
    url: https://www.anthem.com/developers
  x-derived-from: https://totalview.healthos.elevancehealth.com/resources/unregistered/api/v1/fhir/cms_mandate/mcd/metadata
  x-derived-method: derived
servers:
- url: https://totalview.healthos.elevancehealth.com/resources/unregistered/api/v1/fhir/cms_mandate/mcd
  description: Provider Directory production FHIR base (registration required; OAuth 2.0 client credentials)
security:
- bearerAuth: []
tags:
- name: HealthcareService
  description: FHIR HealthcareService resource, profile http://hl7.org/fhir/StructureDefinition/HealthcareService
- name: InsurancePlan
  description: FHIR InsurancePlan resource, profile http://hl7.org/fhir/StructureDefinition/InsurancePlan
- name: Location
  description: FHIR Location resource, profile http://hl7.org/fhir/StructureDefinition/Location
- name: Organization
  description: FHIR Organization resource, profile http://hl7.org/fhir/StructureDefinition/Organization
- name: OrganizationAffiliation
  description: FHIR OrganizationAffiliation resource, profile http://hl7.org/fhir/StructureDefinition/OrganizationAffiliation
- name: Practitioner
  description: FHIR Practitioner resource, profile http://hl7.org/fhir/StructureDefinition/Practitioner
- name: PractitionerRole
  description: FHIR PractitionerRole resource, profile http://hl7.org/fhir/StructureDefinition/PractitionerRole
- name: Specimen
  description: FHIR Specimen resource, profile http://hl7.org/fhir/StructureDefinition/Specimen
- name: Conformance
  description: Server capability statement
paths:
  /metadata:
    get:
      summary: Retrieve the FHIR CapabilityStatement for the Provider Directory server
      description: Returns the server CapabilityStatement (FHIR R4 4.0.1). This endpoint answers anonymously; the
        resource endpoints below do not.
      operationId: getCapabilityStatement
      tags:
      - Conformance
      security: []
      responses:
        '200':
          description: CapabilityStatement resource
          content:
            application/fhir+json:
              schema:
                type: object
                title: CapabilityStatement
  /HealthcareService:
    get:
      summary: Search HealthcareService resources
      description: Search the Anthem / Elevance Health provider directory for HealthcareService resources. Conforms
        to the Da Vinci PDEX Plan Net 1.1.0 implementation guide. Returns a FHIR Bundle of type searchset.
      operationId: searchHealthcareService
      tags:
      - HealthcareService
      parameters:
