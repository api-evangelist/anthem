components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth 2.0 client-credentials access token. Client id, client secret and the token endpoint URL
        are issued by Anthem over secure email after the Provider Directory API Production Environment request form
        is approved. Source: Anthem Interoperability API Endpoint Support Document IO105 v15.0.'
  schemas:
    Bundle:
      type: object
      title: FHIR Bundle
      description: FHIR R4 Bundle. See http://hl7.org/fhir/R4/bundle.html
      properties:
        resourceType:
          type: string
        type:
          type: string
        total:
          type: integer
        link:
          type: array
          items:
            type: object
        entry:
          type: array
          items:
            type: object
    ErrorEnvelope:
      type: object
      title: Anthem gateway error envelope
      description: The non-FHIR JSON error body observed live from this host on 2026-09-02. It is NOT a FHIR OperationOutcome.
      properties:
        status_code:
          type: integer
        status:
          type: string
        error:
          type: string
        error_description:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: 'Internal server error. OBSERVED BEHAVIOUR (probed 2026-09-02): this host returns HTTP 500 with
        this envelope for anonymous requests to every resource path, rather than a 401 or a FHIR OperationOutcome.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status_code: 500
            status: failed
            error: Internal server error
            error_description: An unexpected error occurred. Please try again
