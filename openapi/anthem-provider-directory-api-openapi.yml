        in: query
        required: false
        description: Number of resources to return per page (FHIR paging).
        schema:
          type: integer
      - name: _id
        in: query
        required: false
        description: Logical id of the resource.
        schema:
          type: string
      - name: _lastUpdated
        in: query
        required: false
        description: Date the resource was last updated (FHIR date search).
        schema:
          type: string
      - name: location
        in: query
        required: false
        description: Reference to a Location.
        schema:
          type: string
      - name: name
        in: query
        required: false
        description: Name of the resource (string search).
        schema:
          type: string
      - name: organization
        in: query
        required: false
        description: Reference to an Organization.
        schema:
          type: string
      - name: service-category
        in: query
        required: false
        description: Service category coding, as [system]|[code].
        schema:
          type: string
      - name: service-type
        in: query
        required: false
        description: Service type coding, as [system]|[code].
        schema:
          type: string
      - name: specialty
        in: query
        required: false
        description: Specialty coding, as [system]|[code].
        schema:
          type: string
      responses:
        '200':
          description: Bundle (searchset) of HealthcareService resources
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /HealthcareService/{id}:
