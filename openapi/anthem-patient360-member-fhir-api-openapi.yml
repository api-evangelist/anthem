components:
  securitySchemes:
    smartOnFhir:
      type: oauth2
      description: SMART on FHIR authorization, as declared by the server security extension http://fhir-registry.smarthealthit.org/StructureDefinition/oauth-uris.
      flows:
        authorizationCode:
          authorizationUrl: https://patient360c.anthem.com/P360Member/identityserver/connect/authorize
          tokenUrl: https://patient360c.anthem.com/P360Member/identityserver/connect/token
          refreshUrl: https://patient360c.anthem.com/P360Member/identityserver/connect/token
          scopes:
            patient/Account.read: Read access to the Account resource for the authorized patient.
            patient/AllergyIntolerance.read: Read access to the AllergyIntolerance resource for the authorized patient.
            patient/Appointment.read: Read access to the Appointment resource for the authorized patient.
            patient/AppointmentResponse.read: Read access to the AppointmentResponse resource for the authorized
              patient.
            patient/AuditEvent.read: Read access to the AuditEvent resource for the authorized patient.
            patient/Basic.read: Read access to the Basic resource for the authorized patient.
            patient/Binary.read: Read access to the Binary resource for the authorized patient.
            patient/BodySite.read: Read access to the BodySite resource for the authorized patient.
            patient/Bundle.read: Read access to the Bundle resource for the authorized patient.
            patient/CarePlan.read: Read access to the CarePlan resource for the authorized patient.
            patient/Claim.read: Read access to the Claim resource for the authorized patient.
            patient/ClaimResponse.read: Read access to the ClaimResponse resource for the authorized patient.
            patient/ClinicalImpression.read: Read access to the ClinicalImpression resource for the authorized patient.
            patient/Communication.read: Read access to the Communication resource for the authorized patient.
            patient/CommunicationRequest.read: Read access to the CommunicationRequest resource for the authorized
              patient.
            patient/Composition.read: Read access to the Composition resource for the authorized patient.
            patient/ConceptMap.read: Read access to the ConceptMap resource for the authorized patient.
            patient/Condition.read: Read access to the Condition resource for the authorized patient.
            patient/Conformance.read: Read access to the Conformance resource for the authorized patient.
