openapi: 3.1.0
info:
  title: Anthem Patient360 Member FHIR API
  version: 1.0.0
  description: 'The Anthem Patient360 member FHIR server (P360Member), a live SMART-on-FHIR DSTU2 (FHIR 1.0.2) endpoint
    running CareEvolution HIEBus 32.11.4 and declaring itself as http://anthem.com. It exposes member clinical,
    claims and coverage resources to member-authorized applications.


    DERIVED from the server''s own live Conformance statement at https://patient360c.anthem.com/P360Member/api/fhir/metadata
    (fetched 2026-09-02, HTTP 200) and the SMART/OpenID Connect discovery document at https://patient360c.anthem.com/P360Member/identityserver/.well-known/openid-configuration
    (HTTP 200, 1,048 scopes declared). Only the read and search interactions the server declares are represented;
    the server additionally declares create/update/delete/validate on most resources, which are not part of the
    member-facing read surface and are deliberately not documented here. NOTE: this DSTU2 surface is distinct from
    — and older than — the R4 CMS-mandate Patient Access surface Anthem documents on totalview.healthos.elevancehealth.com.'
  contact:
    name: Anthem Interoperability Workgroup
    email: interoperabilityworkgroup@anthem.com
    url: https://www.anthem.com/developers
  x-derived-from: https://patient360c.anthem.com/P360Member/api/fhir/metadata
  x-derived-method: derived
  x-fhir-version: 1.0.2
