        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /MedicationKnowledge/{id}:
    get:
      summary: Read a MedicationKnowledge by id
      description: Read a single MedicationKnowledge resource by its logical id.
      operationId: readFormularyMedicationKnowledge
      tags:
      - MedicationKnowledge
      parameters:
      - name: id
        in: path
        required: true
        description: Logical id of the MedicationKnowledge resource.
        schema:
