          (IO105 v15.0) "Covered API Searches" table.
        schema:
          type: string
      - name: drug-name
        in: query
        required: false
        description: FHIR search parameter documented in the Anthem Interoperability API Endpoint Support Document
          (IO105 v15.0) "Covered API Searches" table.
        schema:
          type: string
      responses:
        '200':
          description: Bundle (searchset) of MedicationKnowledge resources
          content:
            application/fhir+json:
              schema:
