components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 client-credentials access token. Client id, client secret and the token endpoint URL
        are issued by Anthem over secure email once the Formulary API Production Environment request form is approved.
  schemas:
    Bundle:
      type: object
      title: FHIR Bundle
      description: FHIR R4 Bundle. See http://hl7.org/fhir/R4/bundle.html
      properties:
        resourceType:
          type: string
        type:
          type: string
        total:
          type: integer
        link:
          type: array
          items:
            type: object
        entry:
          type: array
          items:
            type: object
    ErrorEnvelope:
      type: object
      title: Anthem gateway error envelope
      description: Non-FHIR JSON error body observed from this platform on 2026-09-02.
      properties:
        status_code:
          type: integer
        status:
          type: string
        error:
          type: string
        error_description:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 'Forbidden. PROBED 2026-09-02: anonymous requests to this base, including /metadata, return HTTP
        403 with an empty body.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
