note: >-
  ANTHEM SHIPS NO CLIENT SDK FOR ITS APIs. Neither the developer portal nor the Interoperability API
  Endpoint Support Document (IO105 v15.0) mentions a client library in any language; the only integration
  guidance Anthem gives is raw curl. The packages below ARE first-party Anthem code — the Nimbus framework,
  published to Maven Central under the groupId com.antheminc.oss from the github.com/openanthem organisation
  — but they are a Java/Spring web-application framework, not clients for the FHIR APIs, and they are dead:
  all seven artifacts last published 2019-08-22, at a milestone version (1.3.2.M1), and the newest commit in
  the org is from 2020. They are recorded here because a first-party publication that stopped seven years
  ago is a real signal, and deliberately NOT wired as an SDKs pointer, because calling a dormant UI
  framework an SDK for a FHIR API would be false.
