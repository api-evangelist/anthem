description: FOCUS-aligned FinOps view for Anthem's CMS-mandated FHIR APIs. There is no direct charge
  for the regulatory APIs; FinOps focus is on attributing internal compute, storage, and integration costs
  associated with serving Patient Access, Provider Directory, and Drug Formulary endpoints.
notes: No external billing model exists for these regulator-mandated APIs. FinOps is internal cost-attribution
  only.
sources:
  - https://www.anthem.com/developer/
billingModel:
  pricingCategory: No-Charge (Regulatory)
  billingFrequency: N/A
  billingCurrency: USD
  chargeCategories:
    - Usage
focusColumns:
  ServiceName: Anthem FHIR APIs
  ServiceCategory: Healthcare / FHIR Interoperability
  ProviderName: Anthem
  PublisherName: Elevance Health, Inc.
  InvoiceIssuerName: Elevance Health, Inc.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of FHIR API requests served, partitioned by API and authorization mode
    unit: request
    aggregation: sum
    dimensions:
      - api
      - resource_type
      - auth_mode
  - name: data_egress
    description: Bytes returned in FHIR responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - resource_type
  - name: smart_authorizations
    description: Count of SMART on FHIR authorization grants
    unit: authorization
    aggregation: sum
    dimensions:
      - app
principles:
  - name: Visibility
    description: Surface FHIR endpoint usage by resource type and consuming application via internal observability;
      member-level access events are auditable for HIPAA compliance.
  - name: Allocation
    description: Attribute infrastructure cost to the regulatory program (CMS-9115-F) and to the consuming
      third-party app via registered client_id.
  - name: Optimization
    description: Use bulk-data export ($export) for large pulls instead of repeated point reads; cache
      Provider Directory responses; deny pagination abuse.
  - name: Accountability
    description: Compliance and Interoperability program teams own SLAs and infrastructure spend; vendor
      apps accountable for honoring rate limits and member-consent scopes.
maintainers:
