  acp.json, aauth-resource.json and both agent-card paths all miss on www.anthem.com,
  totalview.healthos.elevancehealth.com, patient360c.anthem.com and patient360.anthem.com. The one real
  discovery document Anthem publishes sits one path segment down, under the Patient360 identity server:
