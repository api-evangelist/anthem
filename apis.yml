  - aid: anthem:patient360-member-fhir
    name: Anthem Patient360 Member FHIR API
    description: >-
      The Anthem Patient360 member FHIR server (P360Member) is a live SMART-on-FHIR endpoint serving member
      clinical, claims and coverage resources to member-authorized applications. It runs CareEvolution
      HIEBus 32.11.4, declares itself as http://anthem.com in its own conformance statement, and exposes 32
      FHIR resources. It is a distinct and older surface from the R4 CMS-mandate platform: it still speaks
      FHIR DSTU2 (1.0.2). Its conformance statement and its OpenID Connect / SMART discovery document —
      which declares 1,048 scopes — are both served anonymously, making it the most inspectable Anthem API
      surface even though every data path is authorization-gated.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.anthem.com/developers
    baseURL: https://patient360c.anthem.com/P360Member/api/fhir
