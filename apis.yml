  - aid: anthem:drug-formulary
    name: Anthem Drug Formulary API
    description: >-
      The Anthem Drug Formulary API publishes prescription drug formulary data as HL7 FHIR R4, conforming to
      the Da Vinci Payer Data Exchange (PDEX) US Drug Formulary Implementation Guide 2.0.1 STU2. It covers
      the formularies attached to Anthem Medicare, Medicaid and CHIP plans, the drug lists under each
      formulary, cost sharing, drug tier and pharmacy type — expressed as InsurancePlan
      (PayerInsurancePlan/Formulary), Basic (FormularyItem) and MedicationKnowledge (FormularyDrug)
      resources. Access uses OAuth 2.0 client credentials issued by secure email; this server refuses even
      its own capability statement to an anonymous caller.
