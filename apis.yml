aid: anthem
name: Anthem
description: >-
  Anthem, operating under Elevance Health, is one of the largest health benefits companies in the United
  States, serving members through affiliated Blue Cross and Blue Shield health plans in California, New
  York, Virginia, Georgia, Ohio, Indiana and other states, and through the Amerigroup, Wellpoint, Healthy
  Blue, Simply HealthCare, Unicare, Summit and Clear Health Alliance brands. Anthem's public API surface
  exists because the CMS Interoperability and Patient Access Final Rule (CMS-9115-F) requires it: three HL7
  FHIR APIs — Patient Access (five years of medical, dental, vision and pharmacy claims plus clinical data,
  under CARIN IG for Blue Button STU 2.1.0 and SMART on FHIR), Provider Directory (Da Vinci PDEX Plan Net
  1.1.0) and Drug Formulary (Da Vinci PDEX US Drug Formulary 2.0.1 STU2) — served from
  totalview.healthos.elevancehealth.com, alongside a separate live SMART-on-FHIR member server, Patient360,
  still running FHIR DSTU2. There is no commercial API product, no pricing, no client SDK and no self-serve
  key: production credentials are issued by secure email after a human-reviewed request form. Payer-to-Payer,
  Prior Authorization and Provider Access APIs are committed under CMS-0057-F by 2027-01-01.
