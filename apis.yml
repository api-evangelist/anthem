apis:
  - aid: anthem:patient-access
    name: Anthem Patient Access API
    description: >-
      The Anthem Patient Access API gives members, through applications they authorize, up to five years of
      their own medical, dental, vision and pharmacy claims and clinical data, as required by the CMS
      Interoperability and Patient Access Final Rule (CMS-9115-F). It conforms to HL7 FHIR R4 4.0.1, the
      CARIN Consumer Directed Payer Data Exchange (CARIN IG for Blue Button) STU 2.1.0, US Core 6.1.0 and
      the SMART Application Launch Framework 2.2.0. Production access requires member consent and issues a
      token valid for 90 days; continued access requires renewed consent. Anthem serves a separate
      production base per brand — Amerigroup, Anthem Blue Cross, Anthem Blue Cross Blue Shield, Blue
      Medicare Advantage, Clear Health Alliance, Dell Children Health Plan, Healthy Blue, Healthy Blue Blue
      Choice, Healthy Blue NC, Simply HealthCare, Summit, Unicare and Wellpoint — the Anthem Blue Cross Blue
      Shield base is recorded here. Prior-authorization data is committed to this API by 2027-01-01 under
      CMS-0057-F.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.anthem.com/developers
    baseURL: https://totalview.healthos.elevancehealth.com/resources/registered/AnthemBlueCrossBlueShield/api/v1/fhir
    tags:
      - CARIN Blue Button
      - FHIR
      - Health Insurance
      - Healthcare
      - Interoperability
      - Patient Access
      - SMART on FHIR
