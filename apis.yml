  - aid: anthem:provider-directory
    name: Anthem Provider Directory API
    description: >-
      The Anthem Provider Directory API publishes network provider information as HL7 FHIR R4 4.0.1,
      conforming to the Da Vinci PDEX Plan Net 1.1.0 and HL7 FHIR US Core STU 3.1.1 implementation guides. It
      exposes Practitioner, PractitionerRole, Organization, OrganizationAffiliation, Location,
      HealthcareService, InsurancePlan and Specimen resources so members and prospective members can see
      which providers are in network for a given Anthem plan. The server publishes its own FHIR
      CapabilityStatement anonymously at /metadata; the data paths require an OAuth 2.0 client-credentials
      token whose client id, secret and token endpoint Anthem issues by secure email after approving the
      Provider Directory API Production Environment request form.
