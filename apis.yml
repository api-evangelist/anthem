  - type: Features
    data:
      - name: CMS-Mandated FHIR Interoperability
        description: >-
          Patient Access, Provider Directory and Drug Formulary APIs published to satisfy the CMS
          Interoperability and Patient Access Final Rule (CMS-9115-F), each bound to a named HL7
          implementation guide rather than a bespoke Anthem schema.
      - name: SMART on FHIR Member Authorization
        description: >-
          Members authorize third-party applications through SMART on FHIR authorization_code with PKCE.
          Anthem's Patient360 identity server publishes an anonymous OpenID Connect discovery document
          declaring 1,048 scopes across the patient, user and system contexts.
      - name: Live FHIR Capability Statements
        description: >-
          The Provider Directory server (FHIR R4 4.0.1, publisher "Elevance Health, Inc") and the Patient360
          member server (FHIR DSTU2 1.0.2, CareEvolution HIEBus 32.11.4) both serve their own machine-readable
          capability statements at /metadata without credentials.
      - name: Public Sandbox with Synthetic Data
        description: >-
          A public Patient Access sandbox for FHIR functional testing with synthetic data, open on developer
          self-registration, supporting SMART authorization and SMART client registration.
      - name: Brand-Scoped Production Endpoints
        description: >-
          Thirteen separate Patient Access production bases, one per Elevance Health brand, from Amerigroup
          and Anthem Blue Cross Blue Shield through Simply HealthCare, Unicare and Wellpoint.
  - type: UseCases
    data:
      - name: Member Health Apps
        description: >-
          Member-authorized third-party applications aggregating up to five years of claims, clinical and
          pharmacy history from Anthem plans under CARIN Blue Button.
      - name: In-Network Provider Search
        description: >-
          Applications resolving whether a named practitioner or facility participates in a specific Anthem
          plan network, using Plan-Net PractitionerRole and OrganizationAffiliation edges.
      - name: Drug Coverage and Tier Lookup
        description: >-
          Tools that answer whether a drug is covered by an Anthem Medicare, Medicaid or CHIP formulary, at
          what tier, with what prior-authorization or step-therapy requirement.
      - name: Care Coordination
        description: >-
          Care coordinators and providers reading a member's history with the member's consent to support
          care transitions.
  - type: Integrations
    data:
      - name: CareEvolution HIEBus
        description: >-
          The Patient360 member FHIR server runs CareEvolution's HIEBus platform (version 32.11.4), named in
          the server's own conformance statement.
      - name: CommonWell Health Alliance
        description: >-
          Anthem participates in the CommonWell Health Alliance for cross-organizational clinical data
          exchange.
      - name: Carequality Framework
        description: >-
          Anthem participates in the Carequality interoperability framework for health data exchange between
          networks.

