description: >-
  Anthem publishes NO API plans, no pricing page and no tiers. Its three developer APIs — Patient Access,
  Provider Directory and Drug Formulary — exist because the CMS Interoperability and Patient Access Final
  Rule (CMS-9115-F) requires them, and Anthem's own Interoperability API Endpoint Support Document (IO105
  v15.0, effective 2025-11-18) describes access purely in terms of registration forms, member consent and
  credentials issued by secure email. No price, quota, overage or metered unit appears anywhere on the
  developer portal or in the endpoint support document. Access is therefore free-at-point-of-use but not
  self-serve: production access requires an approval that Anthem says "can take several weeks", and Patient
  Access additionally requires member consent with a token valid for 90 days.
notes: >-
  plan_count is 0 because Anthem publishes no plan, not because a plan was not found. Previous rounds of
  this file asserted a synthetic "Regulatory Access" tier with an unlimited monthly quota at $0.00; that was
  a bulk-sweep generation, not something Anthem published, and it has been removed. The only self-serve
  entry point Anthem offers is the Patient Access sandbox (synthetic data) — see
  sandbox/anthem-sandbox.yml.
plans: []
access:
  cost_to_developer: none published
  self_serve: false
  gated_by:
    - Patient Access API Production Environment request form (https://www.anthem.com/developers/request-anthem-io)
    - Provider Directory API Production Environment request form (https://www.anthem.com/developers/provider-directory-api-request)
    - Formulary API Production Environment request form (developer portal)
    - Member consent, for Patient Access
  approval_lead_time: several weeks (Anthem's own wording)
