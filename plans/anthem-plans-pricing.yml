description: Anthem (operating as Elevance Health) publishes FHIR R4 Patient Access, Provider Directory,
  and Drug Formulary APIs as required by the CMS Interoperability and Patient Access Final Rule (CMS-9115-F).
  These regulatory APIs are offered at no cost to members and authorized third-party applications. Anthem
  does not publish a commercial API plans/pricing page. Use is governed by SMART on FHIR member authorization
  for Patient Access endpoints, while Provider Directory is publicly accessible.
notes: No commercial pricing tiers are published. Anthem's developer APIs are regulator-mandated and free
  for compliant use. Replace with documented values if Anthem publishes a developer plans page.
sources:
  - https://www.anthem.com/developer/
plans:
  - id: anthem-regulatory-access
    name: Regulatory Access (CMS-9115-F)
    type: freemium
    description: Free access to Anthem's CMS-mandated FHIR APIs. Patient Access requires member authorization
      via SMART on FHIR; Provider Directory is publicly available.
    entries:
      - label: API Requests
        name: api_requests
        type: quota
        metric: request
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Anthem Patient Access API
      - name: Anthem Provider Directory API
      - name: Anthem Drug Formulary API
      - name: SMART on FHIR Authorization
      - name: Public Documentation
