    - api: Patient Access
      version: FHIR R4 4.0.1 / CARIN BB STU 2.1.0 / US Core 6.1.0 / SMART App Launch 2.2.0
    - api: Patient360 member FHIR
      version: FHIR DSTU2 1.0.2 (HIEBus 32.11.4)
