note: >-
  Anthem publishes no API changelog, no deprecation policy, no SLA and no status page. What it does publish
  is a VERSIONED CONTROLLED DOCUMENT — the Interoperability API Endpoint Support Document, IO105, currently
  version 15.0 with an effective date of 2025-11-18 and status Active — which is the only dated artifact
  that tracks endpoint change, and a regulator-set roadmap of three APIs due 1/1/27.
versioning:
  scheme: >-
    None at the HTTP layer. Version is expressed by the FHIR release the server implements (R4 4.0.1 on the
    CMS-mandate platform, DSTU2 1.0.2 on Patient360) and by the implementation-guide version each API
    declares. The path segment /api/v1/ on the CMS-mandate base is a platform version, not an API version,
    and there is no published v2.
  current:
