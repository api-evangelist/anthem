note: >-
  Anthem's APIs exist because CMS required them, so the standards below are not marketing claims — they are
  named in Anthem's own Interoperability API Endpoint Support Document (IO105 v15.0, effective 2025-11-18)
  and, where marked probed, they are declared by the FHIR servers themselves in a live capability statement.
domain: healthcare-payer
domain_standard: HL7 FHIR
domain_standard_evidence: >-
  The contract IS a FHIR contract, not a REST API that mentions FHIR. Two live servers publish FHIR
  conformance resources of their own accord: the Provider Directory server returns a FHIR R4
  CapabilityStatement (fhirVersion 4.0.1, publisher "Elevance Health, Inc") at
  /resources/unregistered/api/v1/fhir/cms_mandate/mcd/metadata, and the Patient360 member server returns a
  FHIR DSTU2 Conformance resource (fhirVersion 1.0.2) at /P360Member/api/fhir/metadata carrying the SMART
  security service coding http://hl7.org/fhir/restful-security-service#SMART-on-FHIR. Resource profiles are
  bound to canonical HL7 StructureDefinitions.
