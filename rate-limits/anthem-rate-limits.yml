description: >-
  Anthem publishes no rate limits. The developer portal says nothing about throttling and the
  Interoperability API Endpoint Support Document (IO105 v15.0) — which is otherwise the most detailed
  technical document Anthem publishes, down to per-resource search parameters — contains no limit, window,
  burst, quota or backoff guidance of any kind.
notes: >-
  limit_count is an honest zero: nothing is documented and nothing was observable. Earlier rounds of this
  file asserted per-application and per-IP throttling with 429/503 response codes; that was inferred from
  "typical CMS-9115-F payer implementations", not read from Anthem, and it has been removed rather than
  restated. A consumer sizing an integration against Anthem has no published number to plan against and
  must ask interoperabilityworkgroup@anthem.com.
responseHeaders: []
responseHeaders_note: >-
  PROBED 2026-09-02 against
  https://totalview.healthos.elevancehealth.com/resources/unregistered/api/v1/fhir/cms_mandate/mcd/metadata
  (HTTP 200) and https://patient360c.anthem.com/P360Member/api/fhir/metadata (HTTP 200). Neither response
  carried X-RateLimit-*, RateLimit-*, Retry-After or any other quota signal, so an agent has no runtime
  signal to back off against.
responseCodes: {}
responseCodes_note: >-
  No exhaustion status code is documented. Note that this platform returns HTTP 500 for authorization
  failures (see errors/anthem-problem-types.yml), so a 500 here cannot safely be read as throttling either.
limits: []
policies:
  - name: Ask before you scale
    description: >-
      Production volume is negotiated through the registration form and Anthem developer support; there is
      no self-service tier and no published ceiling. Contact interoperabilityworkgroup@anthem.com.
  - name: Defensive backoff
    description: >-
      With no published limit and no Retry-After header, a client should implement exponential backoff with
      jitter on its own initiative — but must not treat this platform's 500 as transient, because an
      unauthenticated caller receives it indefinitely.
