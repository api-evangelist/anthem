reconciled: false
tags:
  - Rate Limiting
  - FHIR
  - Healthcare
  - Interoperability
description: Anthem does not publish numeric rate limits for its CMS-mandated FHIR APIs. Limits are applied
  per registered application/client and may be raised through developer support. Public Provider Directory
  endpoints may have separate per-IP throttling. Replace with documented values when published.
notes: No public per-second/per-minute numbers documented. Behavior is inferred from typical CMS-9115-F
  payer FHIR implementations.
sources:
  - https://www.anthem.com/developer/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Per-application throttling
    scope: application
    metric: varies
    limit: see provider developer support
    notes: Numeric limits are not published; raise requests via Anthem developer support.
  - name: Public Provider Directory throttling
    scope: IP
    metric: varies
    limit: see provider developer support
    notes: Public, unauthenticated traffic to the FHIR Provider Directory is subject to per-IP throttling
      to protect shared infrastructure.
policies:
  - name: Backoff Strategy
    description: Implement exponential backoff with jitter and honor the Retry-After header when present.
  - name: SMART on FHIR Scoping
    description: Patient Access requests must carry a valid SMART on FHIR token; tokens scoped narrowly
      reduce throttling exposure on shared resource types.
  - name: Raise via Support
    description: Production volume needs are negotiated through Anthem developer support; there is no
      self-service tier upgrade.
